name: Publication Build

on:
  workflow_call:
    inputs:
      version:
        description: "Version label for build metadata"
        required: false
        type: string
        default: "dev"
    outputs:
      publications-artifact:
        description: "Artifact containing built papers and booklets"
        value: ${{ jobs.publications.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  publications:
    name: Build papers and booklets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact-name: ${{ steps.set-name.outputs.name }}
    steps:
      - name: Checkout with shared Workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install publication-specific tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-freefont-ttf fonts-urw-base35 cmake build-essential
          fc-cache -f

      - name: Install PSX
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run repository quality policy
        run: |
          go install github.com/m-mdy-m/psx/cmd/psx@v0.3.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/psx" check --config psx.yml

      - name: Build m-mdy-m/log.c
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.1.0 https://github.com/m-mdy-m/log.c.git "$RUNNER_TEMP/mmlog"
          cmake -S "$RUNNER_TEMP/mmlog" -B "$RUNNER_TEMP/mmlog/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mmlog/install" -DBUILD_SHARED_LIBS=ON -DM_MDY_M_LOG_BUILD_TESTS=OFF -DM_MDY_M_LOG_BUILD_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/mmlog/build" --parallel
          cmake --install "$RUNNER_TEMP/mmlog/build"
          library="$(find "$RUNNER_TEMP/mmlog/install" -type f -name 'libm-mdy-m-log.so*' -print -quit)"
          test -n "$library"
          echo "M_MDY_M_LOG_LIBRARY=$library" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$library"):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Run Pipeline LaTeX preset
        uses: m-mdy-m/pipeline/.github/actions/toolchain-quality@e946f93e460e102fde32d9d8f1427e1808bdd4ab
        with:
          language: latex
          working-directory: .
          stages: build,test
          timeout-seconds: "3600"
        env:
          PROJECT_VERSION: ${{ inputs.version }}
          BUILD_DATE: ${{ github.run_started_at }}

      - name: Upload LaTeX failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-diagnostics-${{ inputs.version }}
          path: |
            build/**/*.log
            build/**/*.fls
            build/**/*.fdb_latexmk
            build/**/*.bcf
            papers/**/main.tex
            .pxis/preset.tex
          retention-days: 7
          if-no-files-found: warn

      - name: Set artifact name
        id: set-name
        run: echo "name=publications-${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Upload publication PDFs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-name.outputs.name }}
          path: build/**/*.pdf
          retention-days: 30
          if-no-files-found: error
