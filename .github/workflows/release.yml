name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  build:
    name: Build publications
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
      build_resumes: false

  publish:
    name: Publish stable release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download publication PDFs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.publications-artifact }}
          path: dist/publications

      - name: Prepare release assets
        run: python scripts/prepare_release_assets.py dist/publications dist/release-assets

      - name: Generate release notes
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          PREV_TAG="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${VERSION}$" | sort -V | tail -1 || true)"
          if [[ -n "$PREV_TAG" ]]; then RANGE="${PREV_TAG}..HEAD"; SINCE="Changes since ${PREV_TAG}"; else RANGE="HEAD"; SINCE="Initial release"; fi
          COMMITS="$(git log "$RANGE" --oneline --no-merges | head -30 || true)"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          FILES=""
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            FILES="${FILES}- [${name}](${REPO}/releases/download/${VERSION}/${name})"$'\n'
          done < <(find dist/release-assets -type f -name '*.pdf' -print0 | sort -z)

          cat > release_body.md <<EOF
          ## ${VERSION}

          **${SINCE}** — built on ${BUILD_TIME}

          ### Publications

          ${FILES:-No publication PDFs were produced.}

          ### Changelog

          ${COMMITS:-No commits found}
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t pdfs < <(find dist/release-assets -type f -name '*.pdf' | sort)
          test "${#pdfs[@]}" -gt 0
          gh release create "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --notes-file release_body.md --verify-tag "${pdfs[@]}"
