name: Pre-release

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - ".editorconfig"
      - ".gitignore"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Step 1 — Build everything (delegated to reusable workflow)
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build (reusable)
    uses: ./.github/workflows/build.yml
    with:
      version: "latest-pre-release"

  # ─────────────────────────────────────────────────────────────────────────
  # Step 2 — Publish pre-release
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish Pre-release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Download artifacts ─────────────────────────────────────────────────
      - name: Download paper PDFs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.papers-artifact }}
          path: dist/papers

      - name: Download resume PDFs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.resumes-artifact }}
          path: dist/resumes

      - name: Download booklet PDFs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.booklets-artifact }}
          path: dist/booklets

      - name: Download roadmap PDFs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.roadmaps-artifact }}
          path: dist/roadmaps
        continue-on-error: true   # roadmaps artifact is optional (warn, not error)

      # ── Move tag to HEAD ───────────────────────────────────────────────────
      - name: Move latest-pre-release tag to HEAD
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest-pre-release HEAD
          git push origin -f latest-pre-release

      # ── Generate release notes ─────────────────────────────────────────────
      - name: Generate release notes
        id: notes
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          REPO="${{ github.server_url }}/${{ github.repository }}"
          TAG="latest-pre-release"

          # Helper: build a sorted markdown table row per PDF
          # Usage: pdf_rows <dir>
          pdf_rows() {
            local dir="$1"
            find "$dir" -name "*.pdf" 2>/dev/null | sort | while read -r f; do
              local name
              name="$(basename "$f")"
              local size
              size="$(du -sh "$f" | cut -f1)"
              local url="${REPO}/releases/download/${TAG}/${name}"
              echo "| \`${name}\` | ${size} | [📄 PDF](${url}) |"
            done
          }

          PAPERS_ROWS="$(pdf_rows dist/papers)"
          RESUMES_ROWS="$(pdf_rows dist/resumes)"
          BOOKLETS_ROWS="$(pdf_rows dist/booklets)"
          ROADMAPS_ROWS="$(pdf_rows dist/roadmaps)"

          cat > release_body.md << EOF
          ## 📄 Latest Pre-release Build

          > **این یک نسخه پیش‌انتشار است — آخرین build از شاخه اصلی.**
          > *This is a rolling pre-release — the latest build from \`main\`, not a stable version.*

          | | |
          |---|---|
          | **Commit** | [\`${SHORT_SHA}\`](${REPO}/commit/${{ github.sha }}) |
          | **Built** | ${BUILD_TIME} |
          | **Triggered by** | ${{ github.actor }} |

          ---

          ### 📚 Papers

          | File | Size | Download |
          |------|------|----------|
          ${PAPERS_ROWS:-| *no papers built* | — | — |}

          ---

          ### 📖 Booklets / جزوه‌ها

          | File | Size | Download |
          |------|------|----------|
          ${BOOKLETS_ROWS:-| *no booklets built* | — | — |}

          ---

          ### 📋 Resumes / رزومه

          | File | Size | Download |
          |------|------|----------|
          ${RESUMES_ROWS:-| *no resumes built* | — | — |}

          ---

          ### 🗺️ Roadmaps / نقشه‌های راه

          | File | Size | Download |
          |------|------|----------|
          ${ROADMAPS_ROWS:-| *no roadmaps built* | — | — |}

          ---

          > برای نسخه پایدار منتظر تگ \`vX.Y.Z\` باشید.
          > *For a stable version, wait for a \`vX.Y.Z\` tag release.*
          EOF

          echo "Generated release body:"
          cat release_body.md

      # ── Collect all PDFs ───────────────────────────────────────────────────
      - name: Collect all PDFs for upload
        run: |
          mkdir -p dist/all
          find dist/papers dist/resumes dist/booklets dist/roadmaps \
            -name "*.pdf" 2>/dev/null | sort | while read -r f; do
            cp "$f" "dist/all/$(basename "$f")"
          done
          echo "Files to release:"
          ls -lhS dist/all/

      # ── Delete & recreate pre-release ──────────────────────────────────────
      - name: Delete existing latest-pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-pre-release --yes 2>/dev/null || true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-pre-release \
            --title "Latest Pre-release Build" \
            --notes-file release_body.md \
            --prerelease \
            --target "${{ github.sha }}" \
            dist/all/*.pdf