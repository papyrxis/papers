name: Pre-release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".editorconfig"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build publications
    uses: ./.github/workflows/build.yml
    with:
      version: latest-pre-release

  publish:
    name: Publish rolling pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download publication PDFs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.publications-artifact }}
          path: dist/publications

      - name: Download English and Persian resume PDFs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.resumes-artifact }}
          path: dist/publications/resumes

      - name: Move rolling tag to HEAD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest-pre-release HEAD
          git push origin -f latest-pre-release

      - name: Prepare release assets
        run: python scripts/prepare_release_assets.py dist/publications dist/release-assets

      - name: Generate release notes
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          TAG="latest-pre-release"
          rows=""
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            size="$(du -sh "$file" | cut -f1)"
            url="${REPO}/releases/download/${TAG}/${name}"
            rows="${rows}| ${name} | ${size} | [PDF](${url}) |"$'\n'
          done < <(find dist/release-assets -type f -name '*.pdf' -print0 | sort -z)

          cat > release_body.md <<EOF
          ## Latest Papyrxis Publications build

          | | |
          |---|---|
          | Commit | [${SHORT_SHA}](${REPO}/commit/${GITHUB_SHA}) |
          | Built | ${BUILD_TIME} |

          | PDF | Size | Download |
          |---|---:|---|
          ${rows:-| No publication PDFs were produced | — | — |}

          This rolling pre-release contains publications and the owner's English and Persian resume PDFs.
          EOF

      - name: Replace rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-pre-release --yes 2>/dev/null || true
          gh release create latest-pre-release --title "Latest Papyrxis Publications build" --notes-file release_body.md --prerelease --target "${{ github.sha }}" dist/release-assets/*.pdf
