name: Pre-release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".editorconfig"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build publications
    uses: ./.github/workflows/build.yml
    with:
      version: latest-pre-release

  publish:
    name: Publish rolling pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download publication PDFs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.publications-artifact }}
          path: dist/publications

      - name: Move rolling tag to HEAD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest-pre-release HEAD
          git push origin -f latest-pre-release

      - name: Generate release notes
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          TAG="latest-pre-release"
          rows=""
          while IFS= read -r file; do
            name="$(basename "$file")"
            size="$(du -sh "$file" | cut -f1)"
            url="${REPO}/releases/download/${TAG}/${name}"
            rows="${rows}| ${name} | ${size} | [PDF](${url}) |"$'\n'
          done < <(find dist/publications -type f -name '*.pdf' | sort)

          cat > release_body.md <<EOF
          ## Latest Papyrxis Publications build

          | | |
          |---|---|
          | Commit | [${SHORT_SHA}](${REPO}/commit/${GITHUB_SHA}) |
          | Built | ${BUILD_TIME} |

          | PDF | Size | Download |
          |---|---:|---|
          ${rows:-| No publication PDFs were produced | — | — |}

          This rolling pre-release contains publications only.
          EOF

      - name: Collect files for release
        run: |
          set -euo pipefail
          mkdir -p dist/all
          find dist/publications -type f -name '*.pdf' -exec cp -t dist/all {} +
          test -n "$(find dist/all -type f -name '*.pdf' -print -quit)"

      - name: Replace rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-pre-release --yes 2>/dev/null || true
          gh release create latest-pre-release --title "Latest Papyrxis Publications build" --notes-file release_body.md --prerelease --target "${{ github.sha }}" dist/all/*.pdf
