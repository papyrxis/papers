schema_version: 2
project:
  name: papers
  type: collection
  title: "Papers — Mahdi Mamashli (Genix)"
  author: "Mahdi Mamashli (Genix)"
  languages: [en, fa]
build:
  output_dir: build
  default_engine: pdflatex
  timeout_seconds: 1800
documents:
  the-nature-of-data:
    type: article
    title: "The Nature of Data"
    style: academic
    editions:
      default:
        source: papers/01-the-nature-of-data/main.tex
        working_directory: papers/01-the-nature-of-data
        engine: pdflatex
        output_name: the-nature-of-data
  what-data-is-and-why-it-must-become-physical:
    type: booklet
    title: "What Data Is, and Why It Must Become Physical"
    editions:
      en:
        source: booklets/01-what-data-is-and-why-it-must-become-physical/en/main.tex
        working_directory: booklets/01-what-data-is-and-why-it-must-become-physical/en
        engine: pdflatex
        output_name: Mamashli-What-Data-Is-EN
      fa:
        source: booklets/01-what-data-is-and-why-it-must-become-physical/fa/main.tex
        working_directory: booklets/01-what-data-is-and-why-it-must-become-physical/fa
        engine: xelatex
        output_name: Mamashli-What-Data-Is-FA
version:
  source: git
  fallback: "dev"
export:
  output_dir: build/export
  targets: [devto]
  tag_limit: 5
components: [fonts, math, graphics, tables, hyperref, colors, layout, bibliography, paper-styles, code, commands/base]
colors:
  scheme: genix
copyright:
  type: cc-by-sa
  year: "auto"
  holder: "Mahdi Mamashli (Genix)"
overrides:
  dir: "configs"
  mode: replace
paper:
  default_style: personal
